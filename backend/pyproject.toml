[project]
name = "metastrip-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask==3.0.3",
    "flask-cors==4.0.1",
    "gunicorn==22.0.0",
    "pillow",
    "piexif==1.1.3",
    "pypdf==4.2.0",
    "python-docx==1.1.2",
    "cachetools==5.3.3",
    "flask-limiter==3.7.0",
    "lxml",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
